services:
  servercommander:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: servercommander
    restart: unless-stopped
    environment:
      SC_HTTP_PORT: ${SC_HTTP_PORT}
      SC_DB_DSN: ${SC_DB_DSN}
      SC_WEBHOOK_SECRET: ${SC_WEBHOOK_SECRET}
      SC_API_TOKEN: ${SC_API_TOKEN}
      SC_WEBHOOK_MAX_BYTES: ${SC_WEBHOOK_MAX_BYTES}
      SC_WEBHOOK_SKEW_SEC: ${SC_WEBHOOK_SKEW_SEC}
      SC_UPLOAD_TMP_DIR: ${SC_UPLOAD_TMP_DIR}
      SC_DISCORD_ENABLED: ${SC_DISCORD_ENABLED}
      SC_DISCORD_BOT_TOKEN: ${SC_DISCORD_BOT_TOKEN}
      SC_DISCORD_GUILD_ID: ${SC_DISCORD_GUILD_ID}
      SC_DISCORD_OPERATOR_IDS: ${SC_DISCORD_OPERATOR_IDS}
      SC_DOCKER_EDGE_NETWORK: ${SC_DOCKER_EDGE_NETWORK}
      SC_CADDY_MODE: ${SC_CADDY_MODE}
      SC_LOG_LEVEL: ${SC_LOG_LEVEL}
      SC_AUTO_CREATE_APP: ${SC_AUTO_CREATE_APP}
      SC_REPLAY_TTL_SEC: ${SC_REPLAY_TTL_SEC}
      SC_RUN_MIGRATIONS_ON_BOOT: ${SC_RUN_MIGRATIONS_ON_BOOT}
    ports:
      - "127.0.0.1:${SC_HTTP_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sc_upload_tmp:/tmp/servercommander
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra
    labels:
      caddy: ${SC_PUBLIC_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"

  caddy-proxy:
    image: lucaslorentz/caddy-docker-proxy:latest
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_INGRESS_NETWORKS: edge
      CADDY_DOCKER_CADDYFILE_PATH: /etc/caddy/Caddyfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - infra

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - infra

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      PGTZ: ${TZ}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - infra

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes;
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - infra

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    container_name: convex-dashboard
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${SC_CONVEX_DASHBOARD_DEPLOYMENT_URL}
      NEXT_PUBLIC_LOAD_MONACO_INTERNALLY: ${SC_CONVEX_DASHBOARD_LOAD_MONACO}
    ports:
      - "127.0.0.1:${SC_CONVEX_DASHBOARD_PORT:-6791}:6791"
    networks:
      - infra
    labels:
      caddy: ${SC_CONVEX_DASHBOARD_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 6791}}"

volumes:
  caddy_data:
  caddy_config:
  sc_upload_tmp:
  mysql_data:
  postgres_data:
  redis_data:

networks:
  infra:
    name: edge
